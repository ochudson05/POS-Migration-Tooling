.ts-box svg{width:14px;height:14px}

.ts-info{margin:0;padding-left:1.1em;font-size:.9rem}.ts-info li{margin:2px 0}
.ts-subs{display:grid;gap:4px;font-size:.9rem}

.ts-links{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.84rem}.ts-links a{color:var(--accent)}
.ts-acts{display:grid;gap:6px}
.ts-act{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;font-size:.9rem;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--bg)}

.ts-act input[type=checkbox]{margin:0;accent-color:var(--ok)}
.ts-at small{display:block;color:var(--muted);font-size:.78rem}
.ts .ts-x{background:none;color:var(--muted);padding:0 4px;font-size:1.1rem;line-height:1}
.ts .ts-x:hover{color:var(--bad)}
.ts-add{display:grid;grid-template-columns:minmax(0,1fr) 140px auto;gap:6px}
.ts-add.wide{grid-template-columns:minmax(0,1fr) 140px 150px minmax(0,200px) auto}
@media (max-width:700px){.ts-add,.ts-add.wide{grid-template-columns:minmax(0,1fr)}}
.ts-tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.ts-tbl th,.ts-tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}

.ts-tbl tr.done td.t{text-decoration:line-through;color:var(--muted)}
.ts-tw{overflow-x:auto}

#ts-report h1{font-size:1.4rem;margin:0 0 4px}#ts-report h2{font-size:1.08rem;margin:20px 0 6px;border-bottom:1px solid #ddd;padding-bottom:3px}
#ts-report h3{font-size:.95rem;margin:12px 0 4px}#ts-report p{margin:4px 0}#ts-report ul{margin:4px 0;padding-left:1.2em}
#ts-report table{border-collapse:collapse;width:100%;font-size:.9rem;margin:6px 0}#ts-report th,#ts-report td{border:1px solid #ccc;padding:5px 8px;text-align:left;vertical-align:top}#ts-report th{background:#f3f3f1}

.ts-msg{min-height:1.2em;font-size:.88rem;color:var(--muted);margin:0}
@media print{body *{visibility:hidden!important}#ts-report,#ts-report *{visibility:visible!important}#ts-report{position:absolute;left:0;top:0;border:0;max-width:none;padding:0}}
.ts-cheatd{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);padding:16px;width:min(820px,calc(100vw - 32px));max-height:calc(100vh - 32px)}

.tc-sheet{font-size:.9rem;line-height:1.4}.tc-sheet header{border-bottom:2px solid var(--accent);margin-bottom:10px}.tc-sheet h1{font-size:1.4rem;margin:0}.tc-sheet header p{margin:2px 0 8px;color:var(--muted)}

.tc-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}.tc-cats div{border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:grid;gap:2px;break-inside:avoid}
.tc-cats small{color:var(--muted)}.tc-cats span{font-size:.82rem}.tc-sheet footer{margin-top:14px;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);font-size:.82rem}
@media print{html.ts-pc body *{visibility:hidden!important}html.ts-pc #ts-cheat .tc-sheet,html.ts-pc #ts-cheat .tc-sheet *{visibility:visible!important}html.ts-pc #ts-cheat{position:absolute;inset:0;border:0;max-height:none;width:auto;padding:0;background:#fff;color:#000}html.ts-pc #ts-report{display:none}html.ts-pc .tc-bar{display:none}}
</style>

<body>
<main class="ts" id="ts">
  <h1>Training Session</h1>
  <p class="ts-sub">Run the customer’s training session from the run sheet. Tick topics as you cover them, add notes at any step, and capture action items as they come up. The Report tab pulls it all into a summary you can copy, print or save as Word.</p>
  <div id="ts-app"></div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id),esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const HELP='https://help.oolio.com/';
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
const OWNERS=['Customer','Oolio','Install team','Support','Other'];
const FLAGS=[['ecom','Online store'],['mpos','mPOS'],['kds','KDS'],['kiosk','Kiosk'],['integ','Integrations']];

/* ---------- the run sheet (Before → Welcome → POS → Back Office → Reporting → Conclusion) ---------- */
const RUN=[
{id:'trb',t:'Before the session',min:0,d:'Get the account ready to demo, but leave some building for the customer to do in the session.',steps:[
  {id:'trb-menu',t:'Load the basic menu',info:['Create some options, variations and combos so you can demo them, but leave some for the customer to create during the session.'],subs:['Basic menu in the account','Some options / variations / combos made for the demo','Some left for the customer to create'],guides:['create-modifiers-and-option-groups','create-variant-groups','create-a-standard-combo']},
  {id:'trb-ecom',when:'ecom',t:'Set up the online store',info:['Set the online store up to the best of your knowledge, and enable online ordering in the POS.'],subs:['Online store set up','Online ordering enabled in the POS'],guides:['create-an-oolio-online-store','create-an-online-menu']},
  {id:'trb-features',t:'Enable the features they’ll see',info:['Turn on every feature and device the customer needs to see. Tick the ones this venue uses.'],subs:['KDS','Customer display (CFD)','mPOS','Floor plan','Seats','Courses','Loyalty'],guides:['configure-kitchen-display-screen','configure-customer-display-settings','configure-mpos','configure-sections-tables','configure-seat-management','create-courses','configure-loyalty']},
  {id:'trb-printers',t:'Printers ready, or virtual printers',info:['Have the venue’s printers set up (or virtual printers) before you demo, or “print failed” pop-ups interrupt the whole session.'],links:[['How to enable a virtual printer (internal)','https://internal.oolio.com/oolioplatform/how-to-enable-a-virtual-printer']]},
  {id:'trb-test',t:'Make a test product',info:['Build a test product (for example “Test Toast”) to demo with, rather than editing their real menu.']},
]},
{id:'trw',t:'Welcome and discovery',min:10,steps:[
  {id:'trw-teams',t:'Remote: customer joined in the Teams app',info:['If the session is remote, make sure they joined through the Teams app (not the browser), so they can take control later.','Turn on speaker identification so the transcript shows who said what.','Bad audio: ask them to rejoin without headphones, and use the chat.']},
  {id:'trw-know',t:'Ask what they already know',info:['Ask early whether they know the difference between products, variants and options. If they do, skip the basics and spend the time on their menu.']},
  {id:'trw-agenda',t:'Explain the agenda',info:['By the end: they know how to use the software, how to maintain the setup, and the system is set up ready for trade.']},

  {id:'trw-modules',t:'Confirm other modules',info:['Online store, KDS, kiosk, mPOS, customer display…'],ph:'Modules they’ll use'},
  {id:'trw-other',t:'Check any other info needed',info:['Loyalty, gift cards, integrations, anything else.']},

{id:'trp',t:'POS',min:45,steps:[

  {id:'trp-send',t:'Sending vs paying the order',info:['Explain the prompt options for table number or name.'],guides:['place-a-pickup-order','place-a-takeaway-order']},

  {id:'trp-open',t:'Open orders and reprinting dockets',guides:['view-open-orders']},
  {id:'trp-fmap',t:'Function map (bottom of screen)',subs:['Void product vs void cart (it’s permissioned)','Discounts / surcharges','Note on a product or the whole order','Quickpay buttons','Print options','Hold print: several orders paid separately, one docket','Order notes print at the top, item notes under the item (hidden on receipts)'],guides:['void-products-or-orders','create-and-customise-function-maps']},
  {id:'trp-mgr',t:'Manager functions',subs:['Print shift summary','Money in / out and what it’s used for','End shift button (come back to it later)','Item availability: syncs with kiosk, online store and integrators','Switch menu','Scheduled surcharge (public holidays etc.)'],guides:['use-cash-events','understand-the-shift-summary','track-items-availability','disable-a-scheduled-surcharge']},

  {id:'trp-fix',t:'Quick fixes and support',info:['Most problems are fixed by Force Sync Menu and Sync Settings, at the bottom of the first Settings page (about 9 in 10).','Then the Support button: an AI chat with the help guides; ask it for a person if needed.'],subs:['Force Sync Menu + Sync Settings shown','Support button shown','Don’t press System Log Out (it drops the device back to choosing a profile)','Training mode is per device and doesn’t report']},
  {id:'trp-online',when:'ecom',t:'Online orders in the POS',info:['Put the store into training mode and submit a test order, so they see it arrive.'],subs:['Training mode on','Test order submitted','How online orders come in','Set delay and pause orders','Item availability','Training mode off again'],guides:['manage-online-orders-in-pos','track-items-availability']},
  {id:'trp-kds',when:'kds',t:'KDS and its settings',guides:['manage-orders-on-kitchen-display-screen-','manage-kitchen-display-settings']},
  {id:'trp-mpos',when:'mpos',t:'mPOS',guides:['place-an-order-on-mpos','process-a-payment-on-mpos']},
  {id:'trp-kiosk',when:'kiosk',t:'Kiosk',guides:['configure-kiosk']},
]},
{id:'tro',t:'Back Office',min:75,d:'Once users are done, hand control to the customer and let them drive.',steps:[
  {id:'tro-access',t:'Getting to Back Office',info:['From the POS, or via oolio.io.']},
  {id:'tro-users',t:'Users',info:['Check the owner already has a user and can log in. Create any other users and make sure the customer gets the email and can log in.','From here on, hand control to the customer.'],subs:['Owner has a user and can log in','Other users created','Customer received the email and logged in','Control handed to the customer','Custom roles instead of the defaults (too permissive)'],guides:['create-a-user','managing-user-roles']},

  {id:'tro-rg',t:'Reporting groups',info:['Explain what they’re for. Keep them high level: Food, Beverage, Retail.'],guides:['create-product-groups-categories-and-reporting-groups']},
  {id:'tro-cat',t:'Categories',info:['Explain what they’re for and add any missing from the pre-work.'],guides:['create-product-groups-categories-and-reporting-groups']},

  {id:'tro-ecom',when:'ecom',t:'Online store setup',subs:['Sync & Save','Brand colour and logo','Opening hours','Settings','Discounts / surcharges','Orders arriving in POS, set delay and pause shown','Item availability tested'],guides:['create-an-oolio-online-store','create-an-online-menu','manage-online-orders-in-pos']},

/* ---------- session clock: elapsed time against a budget per section, so back office isn't squeezed out ---------- */
const hm=ms=>{const m=Math.max(0,Math.round(ms/60000));return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')};
function clockInfo(ven,d){const c=d.clock||{},on=!!(c.t0&&!c.t1),el=c.t0?((c.t1||Date.now())-c.t0):0;
  const secs=RUN.filter(s=>s.min&&s.steps.some(x=>applies(ven,x)));const plan=secs.reduce((a,s)=>a+s.min,0);
  // current section: the first timed one not yet fully covered

  let by=0;for(const s of secs){by+=s.min;if(s===cur)break}

  else if(over>=10)warn=cur.t+' is running '+over+' min over its budget.';
  return{c,on,el,plan,cur,by,over,warn}}

function model(ven,d){const L=stepsOf(ven),p=prog(ven,d,L),A=acts(d),notes=[],missing=[],skipped=[];

    const m=sl.filter(x=>!tick(d,x.id)).map(x=>{const subs=x.subs||[],sv=subsOf(d,x.id),left=subs.filter(k=>!sv[k]);return x.t+(subs.length&&left.length<subs.length?' (still to do: '+left.join('; ')+')':'')});if(m.length)missing.push([s.t,m]);

function reportText(M){const o=[M.title.toUpperCase(),M.meta.map(([k,v])=>k+': '+v).join('\n'),'','SUMMARY','Ready for trade: '+(M.ready||'Not recorded')+(M.plan?'. '+M.plan:''),'Covered: '+M.covered.done+' of '+M.covered.total+' topics.','','ACTION ITEMS'];

  if(OPTS.notes&&(M.notes.length||M.general)){o.push('','NOTES');M.notes.forEach(([s,n])=>{o.push(s+':');n.forEach(([t,x])=>o.push('  - '+t+': '+x))});if(M.general)o.push('General:',M.general)}
  if(OPTS.missing&&M.missing.length){o.push('','NOT COVERED YET');M.missing.forEach(([s,m])=>{o.push(s+':');m.forEach(x=>o.push('  - '+x))})}
  if(OPTS.missing&&M.skipped.length){o.push('','SKIPPED (NOT NEEDED)');M.skipped.forEach(x=>o.push('  - '+x))}
  return o.join('\n')}
function reportView(ven,d){const M=model(ven,d),dis=RO()?' disabled':'';
  return'<div class="ts-card" style="display:grid;gap:12px"><div class="ts-row ts-small">Include:'+[['notes','Notes'],['missing','Not covered and skipped'],['donea','Completed action items']].map(([k,t])=>'<label style="display:flex;gap:4px;align-items:center"><input type="checkbox" data-opt="'+k+'"'+(OPTS[k]?' checked':'')+'>'+t+'</label>').join('')+'</div>'+
    '<div class="ts-row"><button type="button" data-rep="copy">Copy report</button><button type="button" class="ts-sec" data-rep="word">Download Word</button><button type="button" class="ts-sec" data-rep="print">Print / PDF</button><button type="button" class="ts-sec" data-rep="cheat">Staff cheat sheet</button>'+
    (ven.local?'':'<button type="button" class="ts-sec" data-rep="finish"'+dis+'>'+(d.finished?'Finished ✓ (update tracker again)':'Finish session and update tracker')+'</button>')+'</div><p class="ts-msg" id="ts-msg" role="status" aria-live="polite"></p>'+
    '<div id="ts-report">'+reportHtml(M)+'</div></div>'}

const msg=t=>{const m=$('ts-msg');if(m)m.textContent=t||'';if(t&&window.mhToast)window.mhToast(t)};
async function use(n){try{return window.claude&&window.claude.use?await window.claude.use(n):null}catch(e){return null}}
async function saveBlob(blob,fn){const dl=await use('downloads');if(dl){try{await dl.save({filename:fn,data:blob});return true}catch(e){return!!(e&&e.code==='declined')}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true}
async function copyReport(){const ven=venue(),M=model(ven,D()),html=reportHtml(M),text=reportText(M);
  try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);msg('Report copied. Paste it into an email or HubSpot.');return}catch(e){}
  try{const r=document.createRange();r.selectNodeContents($('ts-report'));const s=getSelection();s.removeAllRanges();s.addRange(r);const ok=document.execCommand('copy');s.removeAllRanges();if(ok){msg('Report copied.');return}}catch(e){}
  try{await navigator.clipboard.writeText(text);msg('Report copied as plain text.')}catch(e){msg('Copying is blocked here. Select the report below and copy it.')}}
const DOCXLIB='https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js';
function loadDocx(){return window.docx?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src=DOCXLIB;s.onload=res;s.onerror=()=>rej(new Error('The Word library didn’t load. Check the connection.'));document.head.appendChild(s)})}
async function wordReport(){const ven=venue(),M=model(ven,D());msg('Making the Word file…');
  try{await loadDocx()}catch(e){msg(e.message);return}
  const X=window.docx,P=(t,o)=>new X.Paragraph(Object.assign({children:[new X.TextRun(String(t))]},o||{})),H=(t,l)=>new X.Paragraph({heading:l||X.HeadingLevel.HEADING_2,children:[new X.TextRun(t)]}),B=t=>P(t,{bullet:{level:0}});
  const K=[H(M.title,X.HeadingLevel.HEADING_1)];M.meta.forEach(([k,v])=>K.push(new X.Paragraph({children:[new X.TextRun({text:k+': ',bold:true}),new X.TextRun(v)]})));
  K.push(H('Summary'),P('Ready for trade: '+(M.ready||'Not recorded')+(M.plan?'. '+M.plan:'')),P('Covered: '+M.covered.done+' of '+M.covered.total+' topics.'),H('Action items'));
  const owners=OWNERS.filter(o=>M.byWho[o]);if(!owners.length)K.push(P('None open.'));owners.forEach(o=>{K.push(H(o,X.HeadingLevel.HEADING_3));M.byWho[o].forEach(a=>K.push(B(actLine(a))))});
  if(OPTS.donea&&M.doneA.length){K.push(H('Already done',X.HeadingLevel.HEADING_3));M.doneA.forEach(a=>K.push(B(a.t)))}
  if(OPTS.notes&&(M.notes.length||M.general)){K.push(H('Notes'));M.notes.forEach(([s,n])=>{K.push(H(s,X.HeadingLevel.HEADING_3));n.forEach(([t,x])=>K.push(new X.Paragraph({bullet:{level:0},children:[new X.TextRun({text:t+': ',bold:true}),new X.TextRun(x)]})))});if(M.general){K.push(H('General',X.HeadingLevel.HEADING_3));M.general.split('\n').forEach(l=>K.push(P(l)))}}
  if(OPTS.missing&&M.missing.length){K.push(H('Not covered yet'));M.missing.forEach(([s,m])=>{K.push(H(s,X.HeadingLevel.HEADING_3));m.forEach(x=>K.push(B(x)))})}
  if(OPTS.missing&&M.skipped.length){K.push(H('Skipped (not needed)'));M.skipped.forEach(x=>K.push(B(x)))}
  const blob=await X.Packer.toBlob(new X.Document({sections:[{children:K}]}));
  const fn=(ven.name||'Venue').replace(/[\\/:*?"<>|]/g,'')+' - training session report.docx';
  if(await saveBlob(blob,fn))msg('Saved “'+fn+'”.')}
function finish(){const v=OV(),ven=venue();if(!v||!ven||RO())return;const d=D();save({finished:Date.now()});
  try{v.tick(ven.id,'trn-session');if(d.ready==='Yes')v.tick(ven.id,'trn-ready');if(!ven.o.stage||ven.o.stage==='pre'||ven.o.stage==='ready')v.save(ven.id,{stage:'trained'})}catch(e){}
  msg('Session finished. The Setup Tracker is updated.')}

/* ---------- events ---------- */
const NQ={};let NT=null;
function flushNotes(){clearTimeout(NT);const ks=Object.keys(NQ);if(!ks.length)return;const p={notes:{}};ks.forEach(k=>{if(k==='__g')p.gnote=NQ[k];else p.notes[k]=NQ[k];delete NQ[k]});if(!Object.keys(p.notes).length)delete p.notes;save(p)}
function addAction(f){const t=f.t.value.trim();if(!t)return;const a={id:uid(),t,who:f.who.value,due:f.due?f.due.value:'',step:f.dataset.addform||(f.step?f.step.value:''),done:0,at:Date.now()};
  const v=OV();if(v&&v.me)a.by=v.me();save({actions:[...acts(D()),a]});f.t.value='';msg('Action item added.')}
const setAct=(id,p)=>save({actions:acts(D()).map(a=>a.id===id?Object.assign({},a,p):a)});
function wire(){const app=$('ts-app');if(!app||app.dataset.w)return;app.dataset.w='1';
  app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.tick){e.preventDefault();const id=b.dataset.tick;save({ticks:{[id]:tick(D(),id)===1?0:1}});return}
    if(b.dataset.na){const id=b.dataset.na;save({ticks:{[id]:tick(D(),id)==='na'?0:'na'}});return}
    if(b.dataset.clock){const c=D().clock||{},n=Date.now(),k=b.dataset.clock;
      save({clock:k==='start'?{t0:c.t0&&c.t1?n-(c.t1-c.t0):n,t1:0}:k==='stop'?{t0:c.t0,t1:n}:{t0:0,t1:0}});return}
    if(b.dataset.tab){TAB=b.dataset.tab;ls.set('ts-tab',TAB);render();return}
    if(b.dataset.jump){const s=$('ts-s-'+b.dataset.jump);if(s)s.scrollIntoView({behavior:'smooth'});return}
    if(b.dataset.goto){TAB='run';ls.set('ts-tab',TAB);OPEN.add(b.dataset.goto);render();const el=app.querySelector('[data-sid="'+b.dataset.goto+'"]');if(el)el.scrollIntoView({block:'center'});return}
    if(b.dataset.adel){save({actions:acts(D()).filter(a=>a.id!==b.dataset.adel)});return}
    if(b.dataset.rep==='copy')copyReport();else if(b.dataset.rep==='word')wordReport();else if(b.dataset.rep==='print')window.print();else if(b.dataset.rep==='cheat')cheatSheet();else if(b.dataset.rep==='finish')finish()});
  app.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.sid){if(d.open)OPEN.add(d.dataset.sid);else OPEN.delete(d.dataset.sid)}},true);
  app.addEventListener('submit',e=>{const f=e.target.closest('form[data-addform]');if(!f)return;e.preventDefault();addAction(f)});
  app.addEventListener('input',e=>{const t=e.target;
    if(t.dataset.note!==undefined){NQ[t.dataset.note]=t.value;clearTimeout(NT);NT=setTimeout(flushNotes,800)}
    else if(t.dataset.gnote!==undefined){NQ.__g=t.value;clearTimeout(NT);NT=setTimeout(flushNotes,800)}});
  app.addEventListener('change',e=>{const t=e.target;
    if(t.dataset.sub){const id=t.dataset.sub,sv=Object.assign({},subsOf(D(),id),{[t.dataset.k]:t.checked?1:0}),x=STEP[id],all=(x.subs||[]).every(k=>sv[k]);
      const p={subs:{[id]:{[t.dataset.k]:t.checked?1:0}}};if(all&&tick(D(),id)!==1)p.ticks={[id]:1};save(p)}
    else if(t.dataset.k)save({[t.dataset.k]:t.value});
    else if(t.dataset.top)saveLocalTop({[t.dataset.top]:t.value});
    else if(t.dataset.lflag){const L=loadLocal();saveLocalTop({flags:Object.assign({},L.flags,{[t.dataset.lflag]:t.checked})})}
    else if(t.dataset.all!==undefined){SHOWALL=t.checked;ls.set('ts-all',SHOWALL?'1':'');render()}
    else if(t.dataset.adone)setAct(t.dataset.adone,{done:t.checked?1:0});
    else if(t.dataset.awho)setAct(t.dataset.awho,{who:t.value});
    else if(t.dataset.adue)setAct(t.dataset.adue,{due:t.value});
    else if(t.dataset.opt){OPTS[t.dataset.opt]=t.checked;ls.set('ts-ropts',JSON.stringify(OPTS));render()}
    else if(t.dataset.pick!==undefined&&t.value)OV().setActive(t.value)});
  app.addEventListener('focusout',()=>{setTimeout(()=>{flushNotes();if(DIRTY&&!typing())render()},0)})}

function start(){wire();render();const v=OV();if(v&&v.on)v.on(()=>render());
  addEventListener('hashchange',()=>{if(location.hash==='#training')render()})}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
/* ---------- staff cheat sheet: one printable page made from the venue's own menu, devices and printers ---------- */
// each how-to with its help.oolio.com guides (slugs from the Setup Tracker's baked-in guide list; missing ones are left out)
const CHEAT_HOW=[['Sign in and clock on',['get-started-with-oolio-one-pos','clock-on-off']],['Start an order or open a table',['place-a-dine-in-order','place-a-takeaway-order']],
  ['Add modifiers and notes',['place-a-dine-in-order']],['Find an open order and reprint a docket',['view-open-orders','troubleshoot-printing-issues-in-pos']],
  ['Split a bill and take payment',['process-a-split-bill','process-a-payment-on-mpos']],['Refund or void',['process-a-refund','void-products-or-orders']],
  ['End of day',['close-a-shift','understand-the-shift-summary']]];
function cheatSheet(){const v=venue();if(!v){alert('Pick a venue at the top first.');return}const o=v.o,m=o.menu||{},OVx=OV();
  const byCat=new Map();(m.names||[]).forEach(([n,c])=>{(byCat.get(c||'Other')||byCat.set(c||'Other',[]).get(c||'Other')).push(n)});
  const cats=(m.cats||[]).map(([c,n,pr])=>({c,n,pr,items:(byCat.get(c)||[]).slice(0,10)}));
  const dev=(o.devices||[]).filter(d=>d.name&&!/support/i.test(d.name)),prn=(o.printers||[]).filter(p=>p.name);
  const G=new Set((OVx&&OVx.guides?OVx.guides():[]).map(g=>g.slug)),how=CHEAT_HOW.map(([t,sl])=>[t,sl.filter(x=>G.has(x)).map(x=>'help.oolio.com/'+x).join(' · ')]);
  const e=s=>esc(s==null?'':String(s));
  const html='<div class="tc-sheet"><header><h1>'+e(v.name)+': staff quick guide</h1><p>Oolio POS'+(o.golive?' · live from '+e(new Date(o.golive+'T00:00').toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'})):'')+'</p></header>'+
    (cats.length?'<section><h2>Where things are on the POS</h2><div class="tc-cats">'+cats.map(c=>'<div><b>'+e(c.c)+'</b>'+(c.pr?'<small>prints at '+e(c.pr)+'</small>':'')+'<span>'+c.items.map(e).join(' · ')+(c.n>c.items.length?' · +'+(c.n-c.items.length)+' more':'')+'</span></div>').join('')+'</div></section>':'')+
    (prn.length?'<section><h2>Printers</h2><ul>'+prn.map(p=>'<li><b>'+e(p.name)+'</b>'+(p.loc?' · '+e(String(p.loc).split('·')[0]):'')+(p.use?' · '+e(p.use)+' only':'')+(p.fb?' · if it jams, dockets go to '+e(p.fb):'')+'</li>').join('')+'</ul></section>':'')+
    (dev.length?'<section><h2>Devices</h2><ul>'+dev.map(d=>'<li><b>'+e(d.name)+'</b>'+(d.loc?' · '+e(d.loc):'')+'</li>').join('')+'</ul></section>':'')+
    '<section><h2>How do I…</h2><ul>'+how.map(([t,u])=>'<li><b>'+e(t)+'</b>'+(u?' · '+e(u):'')+'</li>').join('')+'</ul></section>'+
    '<footer>Stuck? Ask your manager, or search help.oolio.com. POS offline? Check the heartbeat icon at the top of the screen and the network cable.</footer></div>';
  let d=document.getElementById('ts-cheat');if(!d){d=document.createElement('dialog');d.id='ts-cheat';d.className='ts-cheatd';document.body.append(d)}
  d.innerHTML='<div class="ts-row tc-bar"><button type="button" data-c="print">Print / PDF</button><button type="button" class="ts-sec" data-c="copy">Copy text</button><button type="button" class="ts-sec" data-c="close">Close</button>'+
    (m.names?'':'<span class="ts-sub" style="margin:0">Convert the venue’s menu first to fill in the POS section.</span>')+'</div>'+html;
  d.onclick=async ev=>{const b=ev.target.closest('[data-c]');if(!b)return;const k=b.dataset.c;
    if(k==='close')d.close();else if(k==='copy'){const t=d.querySelector('.tc-sheet').innerText;try{await navigator.clipboard.writeText(t);b.textContent='Copied'}catch(x){prompt('Copy:',t)}}
    else{document.documentElement.classList.add('ts-pc');const off=()=>{document.documentElement.classList.remove('ts-pc');removeEventListener('afterprint',off)};addEventListener('afterprint',off);window.print();setTimeout(off,1500)}};
  d.showModal()}
window.OolioTraining={cheatSheet,steps:()=>RUN,progress(o){const fl=(o&&o.flags)||{},d=(o&&o.trs)||{},L=RUN.flatMap(s=>s.steps.filter(x=>!x.when||fl[x.when]));return Object.assign(prog(null,d,L),{open:acts(d).filter(a=>!a.done).length,finished:d.finished||0,ready:d.ready||''})}};
})();
