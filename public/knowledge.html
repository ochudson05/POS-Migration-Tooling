<!-- Source of public/knowledge.html (build_apps.py adds the theme boot). Served at /knowledge by relay-worker.js to the
     everyone signed in. Notes come from /api/kg/list (D1 kg_notes); the PLANNER accounts can
     connect their Obsidian vault folder to sync it both ways. Based on the vault's own Knowledge Viewer (_help-db/viewer.html). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script>/* Menu Hauler: applies this device's appearance settings before the page draws, so it never flashes the wrong theme.
   build_apps.py puts it in the <head> of the launcher and the admin page. Settings are saved by shell.js in localStorage
   "mh.settings": {theme: system|light|dark, size: 0.9|1|1.1, motion: system|reduce, start: home|last|<tool>}. */
(()=>{let s={};try{s=JSON.parse(localStorage.getItem('mh.settings')||'{}')||{}}catch(e){}
const r=document.documentElement;
// claude.ai may set its own data-theme; keep it so "System" can go back to it
if(!r.hasAttribute('data-mh-host'))r.setAttribute('data-mh-host',r.getAttribute('data-theme')||'');
if(s.theme==='light'||s.theme==='dark')r.setAttribute('data-theme',s.theme);
if(s.motion==='reduce')r.classList.add('mh-still');
if(+s.size&&+s.size!==1)r.style.setProperty('--mh-zoom',String(+s.size));
})();
</script>

<script>
"use strict";
const EXCLUDE_DIRS=new Set([".obsidian",".claude","_help-db","_claude-commands",".git",".trash"]);
const EXCLUDE_FILES=new Set(["CLAUDE.md","README for Claude.md"]);
const GROUP_ORDER=["Reference","Menu Hauler","Notebook","Clients","Processes","Oolio One Features","Products","Organisation","People","Help Centre"];
const STOP=new Set("a an and are can do does for from how i in is it my of on or the to what when where which who why with you your we our".split(" "));
const WIKI=/\[\[([^\]|#\\]+)(?:#[^\]|\\]*)?(?:\\?\|([^\]]*))?\]\]/g;
const HELPURL=/https?:\/\/help\.oolio\.com\/([a-z0-9-]+)/gi;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug=g=>g.toLowerCase().replace(/[^a-z]+/g,"-").replace(/^-|-$/g,"");
const href=n=>"#/note/"+encodeURIComponent(n.id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let RAW={built:new Date().toISOString(),files:[],live:false}, DB=null, sim=null, ROOT_PRE="";
const TASK=/^(\s*(?:[-*+]|\d+[.)])\s+)\[( |x|X)\]\s+(.*)$/;

/* ---------- parsing ---------- */
function parseFront(text){
  if(!text.startsWith("---"))return[{},text];
  const end=text.indexOf("\n---",3); if(end<0)return[{},text];
  const meta={}; let key=null;
  for(const line of text.slice(3,end).split("\n")){
    let m=line.match(/^([\w-]+):\s*(.*)$/);
    if(m){key=m[1];let v=m[2].trim();if(v.startsWith('"')){try{v=JSON.parse(v)}catch(e){}}meta[key]=v;continue}
    m=line.match(/^\s*-\s+(.*)$/);
    if(m&&key){if(!Array.isArray(meta[key]))meta[key]=meta[key]?[meta[key]]:[];meta[key].push(m[1].trim())}
  }
  return[meta,text.slice(end+4).replace(/^\n/,"")];
}
function plain(md){return md.replace(/!\[[^\]]*\]\([^)]*\)/g," ").replace(/\[\[([^\]|]+)(?:\\?\|([^\]]*))?\]\]/g,(m,a,b)=>b||a)
  .replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/[*_`#>|]+/g," ").replace(/\s+/g," ").trim()}

function build(raw){
  let files=raw.files.map(f=>({path:f.path.replace(/\\/g,"/"),text:f.text.replace(/\r\n/g,"\n")}));
  // if the picked folder is a parent of the vault, strip down to the folder holding "00 Index.md"
  const idx=files.find(f=>/(^|\/)00 Index\.md$/.test(f.path));ROOT_PRE="";
  if(idx&&idx.path!=="00 Index.md"){const pre=idx.path.slice(0,-"00 Index.md".length);ROOT_PRE=pre;files=files.filter(f=>f.path.startsWith(pre)).map(f=>({...f,path:f.path.slice(pre.length)}))}
  const notes=[],inbox=[];
  for(const f of files){
    if(!f.path.endsWith(".md"))continue;
    const parts=f.path.split("/");
    if(parts[0]==="_inbox"){if(parts.length===3&&parts[2]==="request.md"){const[meta]=parseFront(f.text);inbox.push({dir:parts[1],meta})}continue}
    if(parts.some(p=>EXCLUDE_DIRS.has(p)))continue;
    if(parts.length===1&&EXCLUDE_FILES.has(parts[0]))continue;
    const[meta,b0]=parseFront(f.text);
    let body=b0.replace(/^\s+/,""); const h=body.match(/^#\s+(.+)\n+/); if(h)body=body.slice(h[0].length);
    const name=parts[parts.length-1].slice(0,-3), isHelp=parts[0]==="Help Centre";
    const group=parts.length===1?"Reference":parts[0];
    notes.push({id:f.path.slice(0,-3),path:f.path,name,title:h?h[1].trim():name,meta,body,group,isHelp,
      sub:isHelp?(typeof meta.category==="string"?meta.category:(parts.length>2?parts.slice(1,-1).join(" / "):"Overview")):"",
      summary:typeof meta.summary==="string"?meta.summary:"",type:typeof meta.type==="string"?meta.type:"",
      source:typeof meta.source==="string"?meta.source:"",tags:Array.isArray(meta.tags)?meta.tags:[],out:[],inn:[],broken:[]});
  }
  notes.sort((a,b)=>(a.isHelp-b.isHelp)||a.path.localeCompare(b.path));
  const byName=new Map(),byId=new Map(),bySlug=new Map();
  for(const n of notes){byId.set(n.id,n);const k=n.name.toLowerCase();if(!byName.has(k))byName.set(k,n);
    const m=n.source.match(/help\.oolio\.com\/([a-z0-9-]+)/i);if(m&&n.isHelp)bySlug.set(m[1].toLowerCase(),n)}
  const db={notes,byId,byName,bySlug,built:raw.built,live:!!raw.live,tasks:[],inbox};
  DB=db;
  for(const n of notes){
    const outs=new Set(),broken=new Set();
    for(const m of n.body.matchAll(WIKI)){if(n.body[m.index-1]==="!")continue;const t=resolve(m[1]);if(t){if(t!==n)outs.add(t.id)}else broken.add(m[1].trim())}
    for(const m of n.body.matchAll(HELPURL)){const t=bySlug.get(m[1].toLowerCase());if(t&&t!==n)outs.add(t.id)}
    n.out=[...outs];n.broken=[...broken];n.plain=plain(n.body);n.lplain=n.plain.toLowerCase();
    if(!n.isHelp)for(const line of n.body.split("\n")){const m=line.match(TASK);if(m)db.tasks.push({note:n,done:m[2]!==" ",text:m[3]})}
  }
  for(const n of notes)for(const o of n.out)byId.get(o).inn.push(n.id);
  for(const n of notes)n.deg=new Set([...n.out,...n.inn]).size;
  return db;
}
function resolve(name){name=name.trim();const base=name.split("/").pop().replace(/\.md$/i,"");return DB.byName.get(base.toLowerCase())||null}

/* ---------- markdown ---------- */
function wikiToHtml(src){return src.replace(WIKI,(m,t,alias)=>{const n=resolve(t),label=esc((alias||t).trim());
  return n?`<a class="wl" href="${href(n)}">${label}</a>`:`<span class="wl broken" title="No note called “${esc(t.trim())}”">${label}</span>`})}
function clean(html,self){
  const d=document.createElement("div");d.innerHTML=html;
  d.querySelectorAll("script,iframe,object,embed,style,form").forEach(e=>e.remove());
  d.querySelectorAll("*").forEach(e=>{for(const a of[...e.attributes])if(/^on/i.test(a.name))e.removeAttribute(a.name)});
  d.querySelectorAll("a[href]").forEach(a=>{const h=a.getAttribute("href");if(/^\s*javascript:/i.test(h)){a.removeAttribute("href");return}
    const m=h.match(/help\.oolio\.com\/([a-z0-9-]+)/i);const t=m&&DB.bySlug.get(m[1].toLowerCase());
    if(t&&t!==self){a.setAttribute("href",href(t));a.classList.add("wl");a.title="Help Centre: "+t.title;return}
    if(/^https?:/i.test(h)){a.target="_blank";a.rel="noopener"}});
  d.querySelectorAll("img").forEach(i=>{i.loading="lazy";i.referrerPolicy="no-referrer"});
  return d.innerHTML;
}
// turn each to-do line into a real checkbox that knows which to-do it is
function withTicks(body){let k=0;return body.split("\n").map(l=>{const m=l.match(TASK);if(!m)return l;
  return m[1]+`<input type="checkbox" class="tick" data-t="${k++}"${m[2]!==" "?" checked":""}${SYNC?"":" disabled"}> `+m[3]}).join("\n")}
// Obsidian image embeds ![[Notebook/images/x.jpg]] -> <img>, path relative to this page (it sits in the vault root)
const embeds=src=>src.replace(/!\[\[([^\]|]+?\.(?:png|jpe?g|webp|gif|heic|heif))(?:\|[^\]]*)?\]\]/gi,(m,p)=>`<span class="pill img" data-vault="${esc(p.trim())}">Photo: ${esc(p.split("/").pop())}</span>`);
// with the vault folder connected, swap each photo label for the photo itself
async function vaultImages(){if(!HANDLE)return;for(const s of main().querySelectorAll("[data-vault]")){try{const f=await(await fileHandle(HANDLE,s.dataset.vault)).getFile();
  const i=new Image();i.alt=s.textContent;i.src=URL.createObjectURL(f);s.replaceWith(i)}catch(e){s.title="Not found in your vault folder"}}}
function md(src,self){const s=wikiToHtml(embeds(src));return clean(window.marked?marked.parse(s,{gfm:true}):"<pre>"+esc(src)+"</pre>",self)}
function mdInline(src){const s=wikiToHtml(src);return clean(window.marked?marked.parseInline(s,{gfm:true}):esc(src))}

/* ---------- search ---------- */
function terms(q){return q.toLowerCase().split(/[^a-z0-9&]+/).filter(w=>w.length>1&&!STOP.has(w))}
function count(h,w){let c=0,i=0;while((i=h.indexOf(w,i))>=0&&c<20){c++;i+=w.length}return c}
function search(q){
  const ts=terms(q);if(!ts.length)return[];
  return DB.notes.map(n=>{const t=n.title.toLowerCase(),s=n.summary.toLowerCase();let score=0,hit=0;
    for(const w of ts){let any=0;if(t.includes(w)){score+=10;any=1}if(s.includes(w)){score+=4;any=1}const c=count(n.lplain,w);if(c){score+=Math.min(c,8);any=1}hit+=any}
    if(!hit)return null;score*=Math.pow(hit/ts.length,2);if(!n.isHelp)score*=1.15;return{n,score}})
    .filter(Boolean).sort((a,b)=>b.score-a.score).slice(0,60).map(r=>({...r,snip:snippet(r.n,ts)}));
}
function snippet(n,ts){const L=n.lplain;let best=-1;for(const w of ts){const i=L.indexOf(w);if(i>=0&&(best<0||i<best))best=i}
  if(best<0)return esc(n.summary||n.plain.slice(0,180));
  const a=Math.max(0,best-70),txt=(a?"…":"")+n.plain.slice(a,a+220)+"…";
  const re=new RegExp("("+ts.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")","gi");
  return esc(txt).replace(re,"<mark>$1</mark>")}

function groupsOf(){const g=new Map();for(const n of DB.notes){if(!g.has(n.group))g.set(n.group,[]);g.get(n.group).push(n)}
  return[...g.entries()].sort((a,b)=>{const ia=GROUP_ORDER.indexOf(a[0]),ib=GROUP_ORDER.indexOf(b[0]);return(ia<0?50:ia)-(ib<0?50:ib)||a[0].localeCompare(b[0])})}

/* Ask the vault: the best-matching notes' most relevant passages go to Claude (the website's /api/claude, which the owner
   switches on per person), which answers only from them and cites them as [1], [2]. Answers are cached by the Worker. */
function passages(n,ts,max){const P=n.plain.split(/\n{2,}|(?<=[.!?])\s+(?=[A-Z])/).map(s=>s.trim()).filter(s=>s.length>30);
  const sc=P.map((p,i)=>{const l=p.toLowerCase();return[ts.reduce((s,w)=>s+(l.includes(w)?1:0),0),i]}).filter(x=>x[0]).sort((a,b)=>b[0]-a[0]).slice(0,4).sort((a,b)=>a[1]-b[1]);
  let out=sc.map(x=>P[x[1]]).join("\n");if(!out)out=n.plain.slice(0,600);return out.slice(0,max)}
async function ask(q,r){const el=$("#askout"),b=$("#askb");if(!el)return;b.disabled=true;el.innerHTML='<p class="muted">Reading the best matching notes…</p>';
  const ts=terms(q),top=r.slice(0,6);
  if(!top.length){el.innerHTML='<p class="muted">No notes match, so there’s nothing to answer from.</p>';b.disabled=false;return}
  const context=top.map(({n},i)=>`[${i+1}] ${n.title} (${n.group}${n.sub?" / "+n.sub:""})\n${passages(n,ts,1600)}`).join("\n\n");
  const prompt="Answer the question using ONLY the numbered notes from the team's knowledge vault below. Cite the notes you use like [1] or [2]. "+
    "If the notes don't answer it, say so plainly and say what's missing. Keep it short and practical: steps or a few sentences. Australian English.\n\nQuestion: "+q;
  try{const j=await apiCall("/api/claude",{prompt,context,tool:"knowledge",task:"light"});
    const ans=esc(j.text||"").replace(/\[(\d)\]/g,(m,d)=>top[d-1]?`<a href="${href(top[d-1].n)}" title="${esc(top[d-1].n.title)}">[${d}]</a>`:m).replace(/\n/g,"<br>");
    el.innerHTML=`<div class="ask-a">${ans}</div><p class="muted" style="font-size:.8rem;margin:6px 0 0">From ${top.length} notes: ${top.map(({n},i)=>`<a href="${href(n)}">[${i+1}] ${esc(n.title)}</a>`).join(" · ")}${j.cached?" · saved answer, free":""}</p>`}
  catch(e){el.innerHTML=`<p class="muted">Claude couldn’t answer (${esc(e.message)}). The search results below still work.</p>`}
  b.disabled=false}

function graphData(nodes){

function drawForce(svgEl,data,o){

    if(link)link.style("stroke-width",1/k)});

  label=g.append("g").selectAll("text").data(data.nodes).join("text").attr("class","glabel").attr("dy",-7).attr("text-anchor","middle")

  const nb=new Map(data.nodes.map(d=>[d.id,new Set([d.id])]));

    .on("mouseenter",(e,d)=>{const s=nb.get(d.id);node.classed("dim",x=>!s.has(x.id));link.classed("dim",l=>l.source.id!==d.id&&l.target.id!==d.id);
      label.classed("dim",x=>!s.has(x.id)).style("display",x=>s.has(x.id)||showLabel(x)?null:"none")})

function localGraph(n,depth){

    await loadFrom(root,true);
    if(!quiet)toast((done?"Ticked: ":"Unticked: ")+plain(want).slice(0,70),{label:"Undo",fn:()=>setTask(noteId,text,!done,true)});
  }catch(e){console.error("tick failed",e);if(e.name!=="AbortError")toast("Couldn't save the tick: "+e.message,null,12000);route()}
  finally{writing=false}
}
async function refresh(){
  try{
    if(HANDLE&&CAN_WRITE){await loadFrom(HANDLE,true);toast("Reloaded");return}
    let h=HANDLE||await idbGet("vault");
    if(h&&!await perm(h,"read",true))h=null;
    if(!h){h=await window.showDirectoryPicker({id:"oolio-vault",mode:"readwrite"});await idbSet("vault",h)}
    CAN_WRITE=await perm(h,"readwrite",true);
    await loadFrom(h,true);
    toast(CAN_WRITE?`Connected: ${DB.notes.length} notes. Updates automatically and ticks save into your notes`:"Connected read-only: ticking needs you to choose Allow / Edit files",null,6000);
  }catch(e){console.error(e);if(e.name!=="AbortError")toast("Couldn't open the folder: "+e.message,null,10000)}
}
if(!window.showDirectoryPicker){$("#refresh").title="Needs Chrome or Edge.";$("#refresh").onclick=()=>toast("Connecting your vault needs Chrome or Edge.")}
else $("#refresh").onclick=refresh;

/* ---------- menuhauler.com: load the notes, and sync them with the vault folder ----------
   Up: every vault note (except Menu Hauler/Venues/, _inbox/ and the root CLAUDE.md files) whose text differs from the website's copy.
   Down: the venue notes the website writes from Setup Tracker (Menu Hauler/Venues/), whenever the vault's copy differs.
   Notes deleted from the vault are removed from the website. Nothing is ever deleted from the vault. */
let ME=null,SYNC=false,KG_DIR="Menu Hauler/Venues/",SYNCING=false,LAST_SYNC=+(store.get("kg-last")||0),SYNC_T=null;
const SYNC_EVERY=120e3,UP_MAX=380000,BATCH_N=40,BATCH_BYTES=1200000;
const skipUp=p=>!p.endsWith(".md")||p.startsWith(KG_DIR)||p.startsWith("_inbox/")||(!p.includes("/")&&EXCLUDE_FILES.has(p));
const norm=s=>s.replace(/\r\n?/g,"\n");
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function ago(t){const s=Math.round((Date.now()-t)/1e3);return s<60?"just now":s<3600?Math.round(s/60)+" min ago":s<86400?Math.round(s/3600)+" h ago":fmtDate(new Date(t).toISOString())}
async function apiCall(u,body){
  const r=await fetch(u,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),credentials:"same-origin"}:{credentials:"same-origin",cache:"no-store"});
  if(r.status===401){location.href="/login?next="+encodeURIComponent(location.pathname+location.hash);throw new Error("You're signed out.")}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Error "+r.status);return j}
async function writeText(root,path,text){const parts=(ROOT_PRE+path).split("/");let d=root;
  for(const p of parts.slice(0,-1))d=await d.getDirectoryHandle(p,{create:true});
  const fh=await d.getFileHandle(parts[parts.length-1],{create:true}),w=await fh.createWritable();await w.write(text);await w.close()}
function setSync(label,title){const b=$("#syncb");if(!b)return;b.hidden=!SYNC;
  b.innerHTML=label||(LAST_SYNC?`Synced <span class="when">${esc(ago(LAST_SYNC))}</span>`:"Sync");b.title=title||"Sync with menuhauler.com now"}
function syncSoon(ms){clearTimeout(SYNC_T);SYNC_T=setTimeout(()=>syncNow(false),ms||1500)}
async function syncNow(manual){
  if(!SYNC||SYNCING)return;
  if(!HANDLE){if(manual)toast("Click Connect to vault first, and pick your C:\\obsidian\\OOLIO folder.");return}
  if(!await perm(HANDLE,"readwrite",!!manual)){setSync("Sync · allow editing","The browser needs permission to edit your vault folder: click, then choose Allow / Edit files");return}
  SYNCING=true;writing=true;setSync("Syncing…");
  try{
    const list=[];await walk(HANDLE,"",list);
    const files=new Map(list.filter(x=>x.path.startsWith(ROOT_PRE)).map(x=>[x.path.slice(ROOT_PRE.length),x.file]));
    const idx=await apiCall("/api/kg/index");KG_DIR=idx.venueDir||KG_DIR;
    const server=new Map(idx.notes.map(n=>[n.path,n]));
    // down: the venue notes written from Setup Tracker
    const want=[];
    for(const n of idx.notes){if(n.src!=="site")continue;const f=files.get(n.path);if(!f||await sha(norm(await f.text()))!==n.hash)want.push(n.path)}
    let pulled=0;
    if(want.length){const full=await apiCall("/api/kg/list?src=site"),w=new Set(want);for(const n of full.notes)if(w.has(n.path)){await writeText(HANDLE,n.path,n.md);pulled++}}
    // up: my notes
    const up=[],big=[];
    for(const[p,f]of files){if(skipUp(p))continue;const s=norm(await f.text());if(s.length>UP_MAX){big.push(p);continue}const h=await sha(s),x=server.get(p);if(!x||x.hash!==h)up.push({path:p,md:s})}
    const remove=idx.notes.filter(n=>n.src==="vault"&&!files.has(n.path)).map(n=>n.path);
    const batches=[];let cur=[],size=0;
    for(const n of up){if(cur.length&&(cur.length>=BATCH_N||size+n.md.length>BATCH_BYTES)){batches.push(cur);cur=[];size=0}cur.push(n);size+=n.md.length}
    if(cur.length)batches.push(cur);if(!batches.length&&remove.length)batches.push([]);
    let pushed=0;const skipped=[...big];
    for(const[i,b]of batches.entries()){setSync(`Syncing… ${i+1}/${batches.length}`);const r=await apiCall("/api/kg/push",{notes:b,remove:i===0?remove:[]});pushed+=r.saved;skipped.push(...(r.skipped||[]))}
    LAST_SYNC=Date.now();store.set("kg-last",String(LAST_SYNC));
    if(pulled){const y=main().scrollTop;await loadFrom(HANDLE,true);main().scrollTop=y}
    const bits=[pushed?`${pushed} note${pushed===1?"":"s"} up`:"",remove.length?`${remove.length} removed from the website`:"",pulled?`${pulled} venue note${pulled===1?"":"s"} down`:""].filter(Boolean);
    if(manual||bits.length)toast(bits.length?"Synced: "+bits.join(", "):"Already in sync",null,5000);
    if(skipped.length)toast(`Not sent (too big or not allowed): ${skipped.slice(0,3).join(", ")}${skipped.length>3?"…":""}`,null,9000);
  }catch(e){console.error("sync failed",e);setSync("Sync failed","Click to try again: "+e.message);if(manual)toast("Couldn't sync: "+e.message,null,10000);return}
  finally{SYNCING=false;writing=false}
  setSync()}

function start(){build(RAW);renderSide();route()}
(async()=>{
  try{ME=await apiCall("/api/me")}catch(e){main().innerHTML=`<div class="content"><div class="card">${esc(e.message)}</div></div>`;return}
  SYNC=!!ME.kgSync;
  $("#refresh").hidden=!SYNC;$("#nav-add").hidden=!SYNC;setSync();
  $("#syncb").onclick=()=>syncNow(true);
  try{const r=await apiCall("/api/kg/list");KG_DIR=r.venueDir||KG_DIR;RAW={built:new Date(r.now).toISOString(),files:r.notes.map(n=>({path:n.path,text:n.md})),live:false}}
  catch(e){toast("Couldn't load the notes: "+e.message,null,10000)}
  start();setStatus();
  if(SYNC){
    setInterval(()=>{if(!document.hidden&&HANDLE)syncNow(false);setSync(SYNCING?"Syncing…":undefined)},SYNC_EVERY);
    const h=window.showDirectoryPicker&&await idbGet("vault");
    if(h){try{if(await perm(h,"read")){CAN_WRITE=await perm(h,"readwrite");await loadFrom(h,true)}}catch(e){}}
  }
})();
</script>
