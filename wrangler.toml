# Cloudflare deploy settings for the Worker "menurunner" (relay-worker.js): the Menu Hauler website,
# its API and the Google relay. Cloudflare deploys this automatically when changes are pushed to GitHub (Workers Builds).
# Keys and passwords live in Cloudflare as secrets (see the top of relay-worker.js): never put them in this file.
name = "menurunner"
main = "relay-worker.js"
compatibility_date = "2026-11-01"

# keep variables set in the Cloudflare dashboard when deploying
keep_vars = true

# the website's own domain (menuhauler.com, on Cloudflare DNS in the same account). Cloudflare creates the DNS records
# and certificates on deploy. www redirects to the bare domain (relay-worker.js). The workers.dev address stays on,
# because the claude.ai copy's Google relay setting points at it.
workers_dev = true
routes = [
  { pattern = "menuhauler.com", custom_domain = true },
  { pattern = "www.menuhauler.com", custom_domain = true },
]

# the website itself: public/index.html, built by build_apps.py
[assets]
directory = "./public"
binding = "ASSETS"

# shared venue records: venues, menu versions, Firecrawl usage
[[d1_databases]]
binding = "DB"
database_name = "oolio-tools"
database_id = "c3c0e022-71b9-4ac5-b838-dc4862e4eeb4"
